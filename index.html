<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>Stacks</h1>
    <p>Library management system</p>
  </div>
  <button class="btn primary" id="addBtn">Add book</button>
</header>

<main>
  <section class="stats" id="stats" aria-label="Summary"></section>

  <section class="tools">
    <input type="search" id="search" placeholder="Search title, author or ISBN" aria-label="Search books">
    <select id="filterCategory" aria-label="Filter by category"><option value="">All categories</option></select>
    <select id="filterStatus" aria-label="Filter by status">
      <option value="">Any status</option>
      <option value="available">Available</option>
      <option value="issued">Issued</option>
    </select>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Copies</th><th>Status</th><th class="actions-col">Actions</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No books match. Add a book or clear the filters.</p>
  </div>
</main>

<dialog id="formDialog">
  <form id="bookForm" novalidate>
    <h2 id="formTitle">Add book</h2>
    <input type="hidden" id="bookId">
    <label>Title <input id="title" required></label>
    <label>Author <input id="author" required></label>
    <label>ISBN <input id="isbn" required placeholder="e.g. 9780143127741"></label>
    <div class="row">
      <label>Category <input id="category" list="cats" required></label>
      <datalist id="cats"></datalist>
      <label>Total copies <input id="copies" type="number" min="1" value="1" required></label>
    </div>
    <p class="error" id="formError" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary">Save book</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDialog">
  <form method="dialog">
    <h2>Delete this book?</h2>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button class="btn" value="cancel">Keep book</button>
      <button class="btn danger" value="ok">Delete book</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
